<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIT - Semester Grade Report</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card shadow border-0 rounded-3">
                    <div class="card-header bg-dark text-white p-4">
                        <div class="d-flex justify-content-between align-items-center flex-wrap">
                            <div>
                                <h3 class="mb-1" th:text="${student.studentName}"></h3>
                                <p class="mb-0 text-white-50" 
                                   th:text="'Reg No: ' + ${student.registrationNumber} + ' | Semester: ' + ${student.semester}">
                                </p>
                            </div>
                            <div class="bg-success text-white px-4 py-2 rounded text-center mt-3 mt-md-0">
                                <span class="d-block small text-uppercase">Estimated GPA</span>
                                <h2 class="mb-0 fw-bold" th:text="${gpa}"></h2>
                            </div>
                        </div>
                    </div>

                    <div class="card-body p-4">
                        <h5 class="text-secondary border-bottom pb-2 mb-3">Academic Performance Breakdown</h5>
                        <div class="table-responsive">
                            <table class="table table-hover table-bordered text-center align-middle">
                                <thead class="table-secondary">
                                    <tr>
                                        <th>Code</th>
                                        <th class="text-start">Course Title</th>
                                        <th>MSE (30%)</th>
                                        <th>ESE (70%)</th>
                                        <th>Final (100)</th>
                                        <th>Grade</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="res : ${student.results}">
                                        <td class="fw-bold" th:text="${res.subjectCode}"></td>
                                        <td class="text-start" th:text="${res.subjectName}"></td>
                                        <td th:text="${res.mseMarks}"></td>
                                        <td th:text="${res.eseMarks}"></td>
                                        <td class="fw-bold text-primary" th:text="${res.finalMarks}"></td>
                                        <td>
                                            <span th:classappend="${res.grade == 'F'} ? 'bg-danger' : 'bg-success'" 
                                                  class="badge px-3 py-2 fs-6" th:text="${res.grade}">
                                            </span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mt-4">
                            <a th:href="@{/results/input}" class="btn btn-outline-primary">&larr; Enter New Student</a>
                            <button onclick="window.print()" class="btn btn-secondary">Print Grade Card</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
