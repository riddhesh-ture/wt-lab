<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIT - Semester Marks Entry</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card shadow border-0 rounded-3">
                    <div class="card-header bg-primary text-white py-3 text-center">
                        <h4 class="mb-0 fw-bold">VIT Semester Result Entry Portal</h4>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/results/submit}" th:object="${form}" method="POST">
                            <h5 class="text-secondary border-bottom pb-2 mb-3">Student Information</h5>
                            <div class="row g-3 mb-4">
                                <div class="col-md-5">
                                    <label class="form-label fw-semibold">Full Name</label>
                                    <input type="text" th:field="*{studentName}" class="form-control" placeholder="e.g. John Doe" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Registration Number</label>
                                    <input type="text" th:field="*{registrationNumber}" class="form-control" placeholder="e.g. 24BCE0001" required>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label fw-semibold">Semester</label>
                                    <input type="number" th:field="*{semester}" class="form-control" min="1" max="8" required>
                                </div>
                            </div>

                            <h5 class="text-secondary border-bottom pb-2 mb-3">Course Marks (Weightage: MSE 30% | ESE 70%)</h5>
                            <div class="table-responsive">
                                <table class="table table-bordered align-middle">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Course Code & Title</th>
                                            <th style="width: 25%;">MSE Marks (Max 100)</th>
                                            <th style="width: 25%;">ESE Marks (Max 100)</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="res, stat : *{results}">
                                            <td>
                                                <input type="hidden" th:field="*{results[__${stat.index}__].subjectCode}"/>
                                                <input type="hidden" th:field="*{results[__${stat.index}__].subjectName}"/>
                                                <span class="badge bg-dark me-2" th:text="${res.subjectCode}"></span>
                                                <strong th:text="${res.subjectName}"></strong>
                                            </td>
                                            <td>
                                                <input type="number" step="0.01" min="0" max="100" 
                                                       th:field="*{results[__${stat.index}__].mseMarks}" 
                                                       class="form-control" placeholder="MSE Marks" required>
                                            </td>
                                            <td>
                                                <input type="number" step="0.01" min="0" max="100" 
                                                       th:field="*{results[__${stat.index}__].eseMarks}" 
                                                       class="form-control" placeholder="ESE Marks" required>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>

                            <div class="text-center mt-4">
                                <button type="submit" class="btn btn-primary btn-lg px-5 shadow-sm">Calculate & Save Result</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
